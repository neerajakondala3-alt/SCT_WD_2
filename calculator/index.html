<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fully Functional Calculator | Key Support</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', monospace;
            padding: 20px;
            margin: 0;
        }

        .calculator {
            background: #0b1120;
            border-radius: 48px;
            padding: 24px 20px 28px;
            box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 480px;
            transition: all 0.2s;
            border: 1px solid #2d3a5e;
        }

        .display {
            background: #03060e;
            border-radius: 32px;
            padding: 20px 18px;
            margin-bottom: 28px;
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.5), 0 2px 4px rgba(255,255,255,0.02);
        }

        .expression {
            font-size: 1.4rem;
            color: #89a9e6;
            min-height: 2.2rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .result {
            font-size: 2.8rem;
            font-weight: 700;
            color: #eef4ff;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-word;
            line-height: 1.2;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        button {
            background: #1e293b;
            border: none;
            font-size: 1.6rem;
            font-weight: 600;
            padding: 18px 0;
            border-radius: 36px;
            color: #f0f9ff;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            box-shadow: 0 5px 0 #0f1119;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0f1119;
        }

        .operator {
            background: #2d3b52;
            color: #bbd7fb;
            font-size: 1.8rem;
        }

        .equal {
            background: #3b82f6;
            color: white;
            box-shadow: 0 5px 0 #1e40af;
            grid-column: span 1;
        }

        .clear {
            background: #b91c1c;
            color: #ffe2e2;
            box-shadow: 0 5px 0 #7f1a1a;
        }

        .backspace {
            background: #475569;
            font-size: 1.5rem;
        }

        .zero {
            grid-column: span 2;
        }

        button:active {
            transform: translateY(3px);
        }

        .highlight-key {
            filter: brightness(1.2);
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .buttons {
                gap: 10px;
            }
            button {
                padding: 14px 0;
                font-size: 1.4rem;
            }
            .result {
                font-size: 2.2rem;
            }
            .expression {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="calculator">
    <div class="display">
        <div class="expression" id="expressionDisplay"></div>
        <div class="result" id="resultDisplay">0</div>
    </div>
    <div class="buttons" id="buttonGrid">
        <button class="clear" data-action="clear">AC</button>
        <button class="backspace" data-action="backspace">⌫</button>
        <button class="operator" data-op="/">÷</button>
        <button class="operator" data-op="*">×</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button class="operator" data-op="-">−</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button class="operator" data-op="+">+</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button class="equal" id="equalBtn">=</button>

        <button data-digit="0" class="zero">0</button>
        <button data-digit=".">.</button>
        <button class="operator" data-op="%">%</button>
    </div>
</div>

<script>
    (function() {
        let currentExpression = "";
        let lastResult = null;
        let justEvaluated = false;

        const expressionDiv = document.getElementById("expressionDisplay");
        const resultDiv = document.getElementById("resultDisplay");

        function updateDisplay() {
            if (currentExpression === "") {
                expressionDiv.innerText = " ";
            } else {
                expressionDiv.innerText = currentExpression;
            }
            if (lastResult !== null && !justEvaluated) {
                resultDiv.innerText = lastResult;
            } else if (currentExpression === "" && lastResult === null) {
                resultDiv.innerText = "0";
            } else if (justEvaluated && lastResult !== null) {
                resultDiv.innerText = lastResult;
            } else {
                const preview = evaluateExpressionSafely(currentExpression, true);
                if (preview !== null && preview !== undefined && !isNaN(preview) && isFinite(preview)) {
                    let previewVal = parseFloat(preview);
                    if (Math.abs(previewVal) > 1e12) previewVal = previewVal.toExponential(8);
                    else if (Math.floor(previewVal) !== previewVal) previewVal = parseFloat(previewVal.toFixed(8));
                    resultDiv.innerText = previewVal;
                } else {
                    if (currentExpression === "") resultDiv.innerText = "0";
                    else resultDiv.innerText = "?";
                }
            }
        }

        function sanitizeExpression(expr) {
            let cleaned = expr.replace(/[^0-9+\-*/%.]/g, (match) => {
                if (match === '.' || match === '+' || match === '-' || match === '*' || match === '/' || match === '%') return match;
                return '';
            });
            cleaned = cleaned.replace(/([+\-*/%])\1+/g, '$1');
            if (cleaned.startsWith('*') || cleaned.startsWith('/') || cleaned.startsWith('%')) cleaned = cleaned.substring(1);
            cleaned = cleaned.replace(/\.{2,}/g, '.');
            return cleaned;
        }

        function evaluateExpressionSafely(expr, silentPreview = false) {
            if (!expr || expr.trim() === "") return null;
            let sanitized = expr;
            sanitized = sanitized.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
            sanitized = sanitized.replace(/%/g, '/100');
            let evalExpr = sanitized;
            try {
                let result = Function('"use strict"; return (' + evalExpr + ')')();
                if (typeof result !== 'number' || isNaN(result) || !isFinite(result)) {
                    if (!silentPreview) throw new Error("Invalid calculation");
                    return null;
                }
                return result;
            } catch (err) {
                if (!silentPreview) return null;
                return null;
            }
        }

        function computeFinal() {
            if (!currentExpression.trim()) {
                lastResult = null;
                justEvaluated = false;
                updateDisplay();
                return;
            }
            let sanitized = currentExpression.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
            sanitized = sanitized.replace(/%/g, '/100');
            let evalExpr = sanitized;
            try {
                let result = Function('"use strict"; return (' + evalExpr + ')')();
                if (typeof result !== 'number' || isNaN(result) || !isFinite(result)) {
                    resultDiv.innerText = "Error";
                    expressionDiv.innerText = currentExpression || "?";
                    lastResult = null;
                    justEvaluated = true;
                    setTimeout(() => {
                        if (justEvaluated && lastResult === null && currentExpression) {
                            resultDiv.innerText = "Error";
                        }
                    }, 10);
                    return;
                }
                let finalResult = result;
                let roundedResult = finalResult;
                if (Math.abs(finalResult) > 1e12) {
                    roundedResult = finalResult.toExponential(10);
                } else if (Math.floor(finalResult) !== finalResult) {
                    roundedResult = parseFloat(finalResult.toFixed(10));
                }
                lastResult = roundedResult;
                resultDiv.innerText = roundedResult;
                currentExpression = String(roundedResult);
                justEvaluated = true;
                updateDisplay();
            } catch (err) {
                resultDiv.innerText = "Error";
                expressionDiv.innerText = currentExpression;
                lastResult = null;
                justEvaluated = true;
            }
        }

        function handleDigit(digit) {
            if (justEvaluated) {
                currentExpression = "";
                justEvaluated = false;
                lastResult = null;
            }
            if (digit === '.' && currentExpression.split(/[+\-*/%]/).pop().includes('.')) return;
            currentExpression += digit;
            updateDisplay();
        }

        function handleOperator(op) {
            if (justEvaluated) {
                if (lastResult !== null) {
                    currentExpression = String(lastResult);
                    justEvaluated = false;
                    lastResult = null;
                } else {
                    justEvaluated = false;
                }
            }
            const lastChar = currentExpression.slice(-1);
            const ops = ['+', '-', '*', '/', '%'];
            if (ops.includes(lastChar)) {
                currentExpression = currentExpression.slice(0, -1) + op;
            } else if (currentExpression === "") {
                if (op === '-') currentExpression = '-';
                else return;
            } else {
                currentExpression += op;
            }
            updateDisplay();
        }

        function handleClear() {
            currentExpression = "";
            lastResult = null;
            justEvaluated = false;
            updateDisplay();
            resultDiv.innerText = "0";
        }

        function handleBackspace() {
            if (justEvaluated) {
                handleClear();
                return;
            }
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay();
            if (currentExpression === "") {
                lastResult = null;
                resultDiv.innerText = "0";
            }
        }

        function handleEqual() {
            computeFinal();
        }

        function attachKeyboardEvents() {
            window.addEventListener('keydown', (e) => {
                const key = e.key;
                const validDigits = /[0-9]/;
                if (validDigits.test(key)) {
                    e.preventDefault();
                    handleDigit(key);
                }
                else if (key === '.') {
                    e.preventDefault();
                    handleDigit('.');
                }
                else if (key === '+' || key === '-' || key === '*' || key === '/') {
                    e.preventDefault();
                    let opMap = { '*': '*', '/': '/', '+': '+', '-': '-' };
                    if (key === '*') handleOperator('*');
                    else if (key === '/') handleOperator('/');
                    else if (key === '+') handleOperator('+');
                    else if (key === '-') handleOperator('-');
                }
                else if (key === '%') {
                    e.preventDefault();
                    handleOperator('%');
                }
                else if (key === 'Enter') {
                    e.preventDefault();
                    handleEqual();
                }
                else if (key === 'Escape') {
                    e.preventDefault();
                    handleClear();
                }
                else if (key === 'Backspace') {
                    e.preventDefault();
                    handleBackspace();
                }
                else if (key === 'Delete') {
                    e.preventDefault();
                    handleClear();
                }
                const btn = document.querySelector(`button[data-digit="${key}"]`);
                if (btn && !btn.classList.contains('operator')) {
                    btn.classList.add('highlight-key');
                    setTimeout(() => btn.classList.remove('highlight-key'), 120);
                } else if (key === '+' || key === '-' || key === '*' || key === '/' || key === '%') {
                    const opBtn = document.querySelector(`button[data-op="${key === '*' ? '*' : key === '/' ? '/' : key === '+' ? '+' : key === '-' ? '-' : key === '%' ? '%' : ''}"]`);
                    if (opBtn) {
                        opBtn.classList.add('highlight-key');
                        setTimeout(() => opBtn.classList.remove('highlight-key'), 120);
                    }
                }
            });
        }

        function initButtons() {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (btn.hasAttribute('data-digit')) {
                        const digit = btn.getAttribute('data-digit');
                        handleDigit(digit);
                    }
                    else if (btn.hasAttribute('data-op')) {
                        const op = btn.getAttribute('data-op');
                        handleOperator(op);
                    }
                    else if (btn.hasAttribute('data-action')) {
                        const action = btn.getAttribute('data-action');
                        if (action === 'clear') handleClear();
                        else if (action === 'backspace') handleBackspace();
                    }
                    else if (btn.id === 'equalBtn') {
                        handleEqual();
                    }
                });
            });
        }

        function handlePercentDirect() {
        }
        initButtons();
        attachKeyboardEvents();
        updateDisplay();
        resultDiv.innerText = "0";
    })();
</script>
</body>
</html>
